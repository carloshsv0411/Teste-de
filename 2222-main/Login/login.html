<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Tripo Library</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <video autoplay muted loop id="background-video">
    <source src="galaxy.mp4" type="video/mp4" />
    Seu navegador não suporta vídeo.
  </video>

  <header class="header">
    <h1><span class="tripo">TRIPO</span> LIBRARY</h1>
    <nav>
      <a href="#">Livros</a>
      <a href="#">Avaliações</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <div class="login-container">
    <h2>Bem-vindo à <span class="tripo">TRIPO LIBRARY</span></h2>
    <p>Entre ou registre-se para explorar milhares de livros e compartilhar suas leituras favoritas.</p>

    <form id="login-form">
      <input type="text" placeholder="Usuário ou Email" required />
      <input type="password" placeholder="Senha" required />
      <button type="submit">Entrar</button>
      <p class="toggle">Não tem uma conta? <a href="#" onclick="toggleForm()">Registre-se</a></p>
    </form>

    <form id="register-form" style="display: none;">
      <input type="text" placeholder="Nome de usuário" required />
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Senha" required />
      <button type="submit">Registrar</button>
      <p class="toggle">Já tem uma conta? <a href="#" onclick="toggleForm()">Entrar</a></p>
    </form>
  </div>

  <script>
    function toggleForm() {
      const login = document.getElementById('login-form');
      const register = document.getElementById('register-form');
      login.style.display = login.style.display === 'none' ? 'block' : 'none';
      register.style.display = register.style.display === 'none' ? 'block' : 'none';
    }
  </script>
</body>
</html>
